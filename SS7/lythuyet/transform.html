<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin: 50px;
            width: 100px;
            height: 50px;
            background-color: red;
            color: white;
            /*transform: rotate(45deg);*/
            transform: skew(30deg);
        }
        .container:hover{
            transform: scale(1.5);
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <!--
    TRANSFORM: biến hình -->

    <div class="container">transform</div>
</body>
</html>
