<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
        .btn{
            border: none;
            padding: 10px;
            background-color: red;
            color: white;
            border-radius: 10px;

            width: 100px;
        }

</head>

    TRANSITION: chuyển đổi hiệu ứng-->
