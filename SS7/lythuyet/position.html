<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .relative{
            width: 100px;
            height: 100px;
            background-color: red;
            color: white;
            position: relative;
            left: 50px;
            bottom: 0px;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    <!--
    Position: ddihnj vị, vị trí của một phần tử
    1. static
    2. relative: sẽ lấy vị trí ban đầu của nó làm gốc
    3. absolute: tìm phần tử chứa nó gần nhất có thuộc 
                 tính position giá trị khác static làm mốc, nếu không có thì ăn theo màn hình trình duyệt
    4. fixed: cố định thanh header
    5. sticky
    -->

     <div class="box">box</div>
    <div class="relative">relative</div>
</body>
</html>
