<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--
        flex box: giúp căn chỉnh vị trí các phần tử, dàn layout theo chiều
        ngang và dọc. 
        trc đó nếu ko có flex box (float, margin)
        
        1. hai khái niệm quan trọng trong flex box
            + flex-container: phần tử cha
            + flex-item: phần tử con
        2. muốn 1 khối trở thành flex box thì phải có giá trị thuộc tính
           display: flex (none, inline, block, inline-block)
        3. TRỤC trong flex
            chia làm 2 trục:
                + trục chính _MAIN AXIS
                + trục phụ _CROSS AXIS
            =>> hai trục này luôn luôn vuông góc với nhau
        4. flex-direction
            giá trị mặc định của nó là: row
            flex-direction: row: MAIN-AXIS nằm ngang ==> CROSS-AXIS nằm dọc
                          : column: MAIN-AXIS nằm dọc ==> CROSS-AXIS nằm ngang
        5. justity_content: chỉ cần chỉnh theo trục MAIN-AXIS 
            5.1: flex-start giá trị mặc định
            5.2: center: đưa các phần tử ra giữa
            5.3: space-evenly: cách đều các flex-item
            5.4: space-between: đưa các phần tử bắt đầu từ mép và khoảng cách đều nhau
            5.5: space-around: 
            5.6: align-item: chỉ căn theo trục phụ cross-axis
        6. align-items: Chỉ cần chỉnh theo trục phụ cross axis
            flex-start
            center
            flex-end
        7. flex-wrap: giá trị mặc định nowrap: không cho phép phần tử xuống dòng
           flex-wrap: wrap: cho phép xuống dòng khi phần tử khác chiếm diện tích
        8. gap: khoảng cách giữa các flex-item
        9. oder: thứ tự hiển thị của các flex-item
           oder: giá trị mặc định là 0 (phần tử nào có giá trị nhỏ hơn thì ưu tiên hiển thị trước, nhận giá trị )
        10. align-content: căn chỉnh khoảng cách các dòng theo trục dọc
            

           -->
    <div class="main">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
    </div>
        

</body>
</html>
