<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="bt5.css">
</head>

<body>
    <h2>Món ăn nổi bật hôm nay</h2>

    <div class="menu">

        <div class="rowtop">
            <div class="big">
                <img
                    src="https://assets.lightspeedhq.com/img/2019/07/64406e71-francisco-galarza-r9xj7bgt5aw-unsplash-min.jpg">
                <h3>Grilled Wagyu Beef Tenderloin</h3>
                <p class="price">1.200.000đ</p>
            </div>

            <div class="right">
                <div class="small">
                    <img src="https://www.billyparisi.com/wp-content/uploads/2021/05/scallops-2.jpg">
                    <h3>Seared Scallops</h3>
                    <p class="price">320.000đ</p>
                </div>

                <div class="small">
                    <img src="https://thecaviarco.com/cdn/shop/files/Joe_Photoshoot_4_12_18_900x.jpg">
                    <h3>Truffle Deviled Eggs</h3>
                    <p class="price">180.000đ</p>
                </div>
            </div>
        </div>


        <div class="rowbottom">
            <div class="big">
                <img src="https://d1hdnpfpyy58x9.cloudfront.net/uploads/images/cache/big/91/26/40/912646.jpg">
                <h3>Lobster Bisque</h3>
                <p class="price">420.000đ</p>
            </div>

            <div class="big">
                <img src="https://eettafelbermuda.com/wp-content/uploads/sites/40296/2024/03/IMG_6054-scaled.jpg">
                <h3>Pan-Seared Foie Gras</h3>
                <p class="price">580.000đ</p>
            </div>
        </div>

    </div>

</html>
