<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab lọc khóa học</title>
    <link rel="stylesheet" href="./btap6.css">
</head>

<body>

    <header class="header">
        <div class="header-container">
            <div class="logo">
                <span class="rk">RK</span><span class="edu">Edu</span>
            </div>

            <nav class="menu">
                <a href="#">Trang chủ</a>
                <a href="#">Khóa học</a>
                <a href="#" class="active">Khóa học của tôi</a>
                <a href="#">Liên hệ</a>
            </nav>

            <div class="user">
                <img src="https://i.pravatar.cc/40" alt="">
                <span>Nguyễn Văn A</span>
            </div>
        </div>
    </header>


    <section class="banner">
        <h1>Khóa Học Của Tôi</h1>
        <p>Tiếp tục hành trình học tập và phát triển kỹ năng của bạn</p>
    </section>


    <section class="tabs">
        <div class="tab-list">
            <div class="tab active">Tất cả khóa học (4)</div>
            <div class="tab">Đang học (2)</div>
            <div class="tab">Hoàn thành (1)</div>
            <div class="tab">Đã lưu (1)</div>
        </div>
    </section>

</body>

</html>
